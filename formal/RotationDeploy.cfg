\* The deploy to a new key: isolates under the old one serve on, the signer replaced mid-tick, a crash, a backup restored (MCRotation.tla).
\* model MCRotation
SPECIFICATION Spec
CONSTANTS
    MaxN = 4
    MaxCrashes = 1
    Eve = FALSE
    EveBudget = 0
    EveDeletes = "none"
    Restore = TRUE
    Rollback = FALSE
    Chunked = FALSE
    EveMoves = FALSE
    EveClaims = FALSE
    Reader = FALSE
    Writers <- TwoWriters
    KeyOf <- TwoKeys
    BoundaryChecked = TRUE
    RetiredRefused = TRUE
    RefusedUnderLock = TRUE
    RotateUnderLock = TRUE
    MemoryUnderPrevious = TRUE
    RowUnderPrevious = TRUE
    RotationProbed = TRUE
    AnchorKeyHeld = TRUE
    PendingAccepted = TRUE
    KeyNeverBack = TRUE
    NumberInRotation = TRUE
    SignerVerified = TRUE
    KeyringBound = TRUE
    SnapshotRead = TRUE
INVARIANTS
    TypeOK
    OneRotation
    OldWritesBelowBoundary
    SealedBelowBoundary
    NoOldPairOverRotation
    NoFalseAlarm
PROPERTIES
    LogWorks
CHECK_DEADLOCK FALSE
