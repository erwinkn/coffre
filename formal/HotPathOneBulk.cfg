\* The bulk cap: three uses of one principal, each asking for one of two keys, at most one key in any window of 3, keys moved on once 2 old; covers on; Postgres's clock moves on, deadlines 1 after each use's `at` (HotPathOneClock.tla).
\* model HotPathOneClock
SPECIFICATION Spec
CONSTANTS
    Uses = {"u1", "u2", "u3"}
    Keys = {"k1", "k2"}
    MaxTime = 6
    MaxClockBacks = 0
    MaxSkew = 0
    D = 1
    MaxCheckpoints = 0
    Covers = TRUE
    BulkCount = 1
    BulkWindow = 3
    Refresh = 2
    DeadlineChecked = TRUE
    FloorChecked = TRUE
    WorkerHonoursDeadline = TRUE
    PrincipalLocks = TRUE
    RefreshOnUse = TRUE
    CoverFresh = TRUE
    Slack = TRUE
    DeadlineSlack = TRUE
INVARIANTS
    BulkCapHolds
    BulkReplayAgrees
    NoLateWork
    ReleaseByDeadline
CHECK_DEADLOCK FALSE
