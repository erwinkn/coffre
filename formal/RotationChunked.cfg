\* The deploy to a new key, each tick sealing its window a part at a time: a pair under the new key below the rotation (MCRotation.tla).
\* model MCRotation
SPECIFICATION Spec
CONSTANTS
    MaxN = 4
    MaxCrashes = 1
    Eve = FALSE
    EveBudget = 0
    EveDeletes = "none"
    Restore = FALSE
    Rollback = FALSE
    Chunked = TRUE
    EveMoves = FALSE
    EveClaims = FALSE
    Reader = FALSE
    Writers <- TwoWriters
    KeyOf <- TwoKeys
    BoundaryChecked = TRUE
    RetiredRefused = TRUE
    RefusedUnderLock = TRUE
    RotateUnderLock = TRUE
    MemoryUnderPrevious = TRUE
    RowUnderPrevious = TRUE
    RotationProbed = TRUE
    AnchorKeyHeld = TRUE
    PendingAccepted = TRUE
    KeyNeverBack = TRUE
    NumberInRotation = TRUE
    SignerVerified = TRUE
    KeyringBound = TRUE
    SnapshotRead = TRUE
INVARIANTS
    TypeOK
    OneRotation
    OldWritesBelowBoundary
    SealedBelowBoundary
    NoFalseAlarm
PROPERTIES
    LogWorks
CHECK_DEADLOCK FALSE
