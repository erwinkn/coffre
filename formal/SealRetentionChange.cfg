\* SealRetention.cfg with a change (c1) as well, which the cut must keep (CutUsesOnly), with one attacker step and no witness (Seal.tla).
\* model Seal
SPECIFICATION Spec
CONSTANTS
    Appends = {"u1", "c1", "r"}
    Changes = {"c1", "r"}
    MaxTicks = 3
    MaxAttacks = 1
    MaxCrashes = 1
    NumberUnderLock = TRUE
    CloseLocks = TRUE
    SignerMemory = TRUE
    RowChecked = TRUE
    PairChecked = TRUE
    PairVerified = TRUE
    Witness = FALSE
    RememberFirst = TRUE
    PairRemembered = TRUE
    PairWrittenTogether = TRUE
    MacChecked = TRUE
    KindInMac = TRUE
    RequestIdChecked = TRUE
    WaitForSeal = TRUE
    Retention = TRUE
    RetAppend = "r"
    MaxTime = 2
    Fresh = 1
    FreshChecked = TRUE
    DropAfterSeal = TRUE
    FreshBeforeDrop = TRUE
    CutSealed = TRUE
    CutUsesOnly = TRUE
    KeepCutTiles = TRUE
INVARIANTS
    Complete
    KeptNotLost
    SplitViewDetected
    AnsweredChangeKept
    NoForgerySealed
    KindKept
    PairConsistent
    NoUndetectedReplay
    NoFalseAlarm
    DroppedNeverResealed
    ChangesUntouched
CHECK_DEADLOCK FALSE
