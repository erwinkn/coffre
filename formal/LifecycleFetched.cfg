\* A binding of keys its issuer publishes, which the vault does not fetch: the app verifies its tokens, and the compromised app signs a run in with one nobody signed (EverySignInOnValidToken, which TLC must find broken). A binding the app made up is still refused (BindingSealed).
\* model MCLifecycle
