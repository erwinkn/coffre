\* Walks between beats over a backlog, two beats at once, an edit in the backlog and a monitor (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- WalkingLog
    InitAnchor <- WalkingAnchor
    Procs <- WalkingProcs
    Ops <- WalkingOps
    Budget <- WalkingBudget
    MaxLen = 16
    Walk = 2
    CkptWalk = 30
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    CheckpointLinksWalk = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    AnchorHeld = TRUE
    ReadinessChecksHeld = TRUE
    AnchorCas = TRUE
    BeatRetries = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    FoundEditStaysRed
    GreenIsReal
    AnchorNeverBack
CHECK_DEADLOCK TRUE
