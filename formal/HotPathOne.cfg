\* Two uses, each one call, while a change revokes then grants again, a change statement fails once after locking, the checkpointer closes and signs, and Postgres may crash once. Uses share the lock; changes and the checkpointer take it exclusive (HotPathOne.tla).
\* model HotPathOne
SPECIFICATION Spec
CONSTANTS
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxAborts = 1
    MaxCheckpoints = 1
    MaxCrashes = 1
    Covers = FALSE
    UseLocks = TRUE
    StatementSnapshot = TRUE
    UseNumberUnderLock = TRUE
    ChangeLocks = TRUE
    ChangeNumberUnderLock = TRUE
    LockToCommit = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    SyncCommit = TRUE
    CheckpointLocks = TRUE
    CoverChecksChanges = TRUE
INVARIANTS
    TotalOrder
    ReplayAgrees
    NothingAllowedAfterAnswer
    DurableBeforeRelease
    CheckpointsHold
    NumbersUnique
    RepeatsAreTheirCover
CHECK_DEADLOCK FALSE
