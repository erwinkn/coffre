\* Two uses, each one call, reading two inputs (the member and its credential), while a change revokes or restores either, twice; a change statement fails once after locking, the checkpointer closes and signs, and Postgres may crash once. Uses share the lock; changes and the checkpointer take it exclusive (HotPathOne.tla).
\* model HotPathOne
SPECIFICATION Spec
CONSTANTS
    Inputs = {"member", "credential"}
    Uses = {"u1", "u2"}
    Changers = {"c1"}
    MaxChanges = 2
    MaxAborts = 1
    MaxCheckpoints = 1
    MaxCrashes = 1
    MaxTampers = 0
    SealCache = FALSE
    MaxRestores = 0
    Covers = FALSE
    UseLocks = TRUE
    StatementSnapshot = TRUE
    UseNumberUnderLock = TRUE
    ChangeLocks = TRUE
    ChangeNumberUnderLock = TRUE
    LockToCommit = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    SyncCommit = TRUE
    CheckpointLocks = TRUE
    CoverChecksChanges = TRUE
    CoverChecksAllInputs = TRUE
    SealMember = TRUE
    SealCredential = TRUE
    SealSecret = TRUE
    SealEnvironment = TRUE
    StaleFirst = TRUE
    CacheChecked = TRUE
    CacheSameChange = TRUE
    ChangeCAS = TRUE
    CoverExists = TRUE
INVARIANTS
    TotalOrder
    ReplayAgrees
    NothingAllowedAfterAnswer
    DurableBeforeRelease
    CheckpointsHold
    NumbersUnique
    EachChangeFlips
    RepeatsAreTheirCover
CHECK_DEADLOCK FALSE
