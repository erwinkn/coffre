\* Two uses, each one call, reading two inputs (the member and its credential), while a change revokes or restores either, twice; a change statement fails once after locking, the checkpointer closes and signs, and Postgres may crash once. Uses share the lock; changes and the checkpointer take it exclusive (HotPathOne.tla).
\* model HotPathOne
