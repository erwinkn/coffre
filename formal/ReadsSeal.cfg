\* The signer alone fair, the projector free to stop for good: every change is still sealed and answered (Reads.tla).
\* model MCReads
SPECIFICATION SignerFairSpec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    Chunk = 2
    Projectors = {"p1"}
    MaxCrashes = 0
    MaxAttacks = 0
    Retention = FALSE
    Attacks = {}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
    FromChecked = TRUE
INVARIANTS
    SealNeverWaitsOnProjection
PROPERTIES
    ChangeAnswered
CHECK_DEADLOCK FALSE
