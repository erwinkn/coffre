\* As Reads, but the use's MAC covers only its own columns, as today's: what the projector derives by probing the changes is only as good as Seal's verifier (Reads.tla).
\* model MCReads
SPECIFICATION Spec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    At <- ReadsAt
    Chunk = 2
    Projectors = {"p1"}
    MaxCrashes = 1
    MaxAttacks = 2
    Retention = FALSE
    Attacks = {"uses", "changes", "live", "reads", "cursor"}
    DeriveFromSealed = TRUE
    InputsInUseMac = FALSE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
    FromChecked = TRUE
    NewestWithRows = TRUE
    GreatestAt = TRUE
    NewestChecked = TRUE
    NewestRetired = TRUE
INVARIANTS
    ProjectionMatchesReplayOrFlagged
    OnlySealedProjected
    LagShown
    DeletionDetected
    ReportNamesListed
    UnnamedDetected
CHECK_DEADLOCK FALSE
