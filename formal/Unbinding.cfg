\* A binding removed in batches while one run keeps signing in through it: ended, every credential revoked and sealed, the removal answered (MCUnbinding.tla).
\* model MCUnbinding
SPECIFICATION Spec
CONSTANTS
    SignIns <- OneRun
    Creds <- TwoCreds
    Batch = 1
    Crashes = 0
    Using = TRUE
    Replacing = FALSE
    Abandons = FALSE
    Closes = TRUE
    SignInChecksClosed = TRUE
    CloseExclusive = TRUE
    EndComplete = TRUE
    EndExclusive = TRUE
    SealWait = TRUE
    Resumes = TRUE
    RevokeCAS = TRUE
    EndChecksLive = TRUE
    UseChecksClosed = TRUE
    MakesAtClose = TRUE
    CloseFenced = TRUE
    BatchFenced = TRUE
    VaultChecksClosed = FALSE
INVARIANTS
    TypeOK
    EndedBindingEndsCredentials
    ClosedServesNone
    RevokeOrdersUses
    NoGapInTrust
    NoSignInAfterClose
    NoDoubleRevoke
    EndsOnce
    AnsweredWhenSealed
PROPERTIES
    ClosedStaysClosed
    UnbindFinishes
    RemovalEnds
CHECK_DEADLOCK FALSE
