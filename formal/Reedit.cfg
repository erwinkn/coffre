\* Someone edits an entry, reverts it once a beat found it, and edits it again behind every cursor (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- ReeditProcs
    Ops <- ReeditOps
    Budget <- ReeditBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    Clears = TRUE
    ClearsOverFault = TRUE
INVARIANTS
    FoundEditStaysRed
CHECK_DEADLOCK TRUE
