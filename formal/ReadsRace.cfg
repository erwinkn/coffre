\* Two projectors racing over the same log (Workers retries), one crash, no attacker (Reads.tla).
\* model MCReads
SPECIFICATION Spec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    Chunk = 2
    Projectors = {"p1", "p2"}
    MaxCrashes = 1
    MaxAttacks = 0
    Attacks = {}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
INVARIANTS
    ProjectionMatchesReplay
    OnlySealedProjected
    LagShown
    NoDuplicate
    DeletionDetected
    SealNeverWaitsOnProjection
CHECK_DEADLOCK FALSE
