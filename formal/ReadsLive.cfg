\* The signer and the projector fair, one projector crash, no attacker: every sealed use is projected and the cursor reaches the seal (Reads.tla).
\* model MCReads
SPECIFICATION FairSpec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    Chunk = 2
    Projectors = {"p1"}
    MaxCrashes = 1
    MaxAttacks = 0
    Retention = FALSE
    Attacks = {}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
    FromChecked = TRUE
INVARIANTS
    ProjectionMatchesReplay
    LagShown
PROPERTIES
    EveryUseProjected
    CursorReachesSeal
CHECK_DEADLOCK FALSE
