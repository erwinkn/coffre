\* model MCWorkloadTripwire
SPECIFICATION Spec
CONSTANTS
    Procs <- ThiefProcs
    Ops <- ThiefOps
    Budget <- ThiefBudget
    Most <- ThiefMost
    Replicas = 1
    Life = 2
    Overlap = 1
    Threshold = 2
    MaxTime = 3
    ExcessIntegral = TRUE
    ChurnCounted = TRUE
    RootsOnly = TRUE
    RefusesWhenFull = TRUE
    BusyIsNoSignal = TRUE
    TripLags = FALSE
    TripFencedOnLift = TRUE
    ReplicasFull = FALSE
    ThiefStays = FALSE
INVARIANTS
    TypeOK
    TripwireFires
CHECK_DEADLOCK TRUE
