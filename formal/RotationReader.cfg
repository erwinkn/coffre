\* A reader (vouch, the reads' projector) bounding the old key from the rotations and the newest pair across the deploy (MCRotation.tla).
\* model MCRotation
SPECIFICATION Spec
CONSTANTS
    MaxN = 4
    MaxCrashes = 1
    Eve = FALSE
    EveBudget = 0
    EveDeletes = "none"
    Restore = FALSE
    Rollback = FALSE
    Chunked = FALSE
    EveMoves = FALSE
    EveClaims = FALSE
    Reader = TRUE
    Writers <- TwoWriters
    KeyOf <- TwoKeys
    BoundaryChecked = TRUE
    RetiredRefused = TRUE
    RefusedUnderLock = TRUE
    RotateUnderLock = TRUE
    MemoryUnderPrevious = TRUE
    RowUnderPrevious = TRUE
    RotationProbed = TRUE
    AnchorKeyHeld = TRUE
    PendingAccepted = TRUE
    KeyNeverBack = TRUE
    NumberInRotation = TRUE
    SignerVerified = TRUE
    KeyringBound = TRUE
    SnapshotRead = TRUE
INVARIANTS
    TypeOK
    ReaderSound
    ReaderNoFalseAlarm
CHECK_DEADLOCK FALSE
