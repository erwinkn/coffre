\* Covers: two uses, each one call, the later one passing the cover the earlier left if it was allowed, reading two inputs (the member and the secret), while a change revokes or restores either, twice; a change statement fails once after locking, the checkpointer closes and signs, and Postgres may crash once (HotPathOne.tla).
\* model HotPathOne
SPECIFICATION Spec
CONSTANTS
    Inputs = {"member", "secret"}
    Uses = {"u1", "u2"}
    Changers = {"c1"}
    MaxChanges = 2
    MaxAborts = 1
    MaxCheckpoints = 1
    MaxCrashes = 1
    MaxTampers = 0
    SealCache = TRUE
    MaxRestores = 0
    Covers = TRUE
    UseLocks = TRUE
    StatementSnapshot = TRUE
    UseNumberUnderLock = TRUE
    ChangeLocks = TRUE
    ChangeNumberUnderLock = TRUE
    LockToCommit = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    SyncCommit = TRUE
    CheckpointLocks = TRUE
    CoverChecksChanges = TRUE
    CoverChecksAllInputs = TRUE
    SealMember = TRUE
    SealCredential = TRUE
    SealSecret = TRUE
    SealEnvironment = TRUE
    StaleFirst = TRUE
    CacheChecked = TRUE
    CacheSameChange = TRUE
    ChangeCAS = TRUE
    CoverExists = TRUE
INVARIANTS
    TotalOrder
    ReplayAgrees
    NothingAllowedAfterAnswer
    DurableBeforeRelease
    CheckpointsHold
    NumbersUnique
    EachChangeFlips
    RepeatsAreTheirCover
CHECK_DEADLOCK FALSE
