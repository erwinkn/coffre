\* A CI run's token exchanged again and again while its principal is served by two shards, which restart and run two instances (ShardsExchange.tla).
\* model ShardsExchange
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1", "s2"}
    Slots = {1, 2}
    Jtis = {"j1"}
    Attempts = 3
    MaxStarts = 2
    JtiSpentInShard = TRUE
    JtiAtHome = TRUE
INVARIANTS
    SingleUseExchange
CHECK_DEADLOCK FALSE
