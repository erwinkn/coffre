\* Ada regenerates k in a fork while its parent is archived and the key she replaces is written (MCWriting.tla).
\* model MCWriting
SPECIFICATION Spec
CONSTANTS
    Procs <- ForkProcs
    MaxTries = 2
    RequestUnderFence = TRUE
    Held = {"cred", "member", "policy", "env", "parent", "replaced"}
    GuardsAfterFence = TRUE
    GuardOnLog = TRUE
    ChangeCAS = TRUE
    AdmitHeld = {"actor", "policy"}
    PrincipalCAS = TRUE
    WaitForSeal = TRUE
INVARIANTS
    TypeOK
    WritesStandAtCommit
    KeyChangesFlip
    RequestsReplay
    AddsStandAtCommit
    AddsFlip
    AnsweredSealed
    TwoTrips
CHECK_DEADLOCK TRUE
