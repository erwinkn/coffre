\* Two starts under the new app key rotate at once, beside an instance under the old one and someone who holds it (MCAppKey.tla).
\* model MCAppKey
SPECIFICATION Spec
CONSTANTS
    N = 2
    MaxLen = 8
    Procs <- RotatingProcs
    Ops <- RotatingOps
    Budget <- RotatingBudget
    StateUnderHead = TRUE
    RetiredCheck = TRUE
    WalkCutoff = TRUE
INVARIANTS
    TypeOK
    OneRotate
    NoLaunderingAfterRotate
    OldKeyWritesNothingAfter
    RotationComplete
    NothingForgedAccepted
CHECK_DEADLOCK TRUE
