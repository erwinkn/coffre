\* A shard restarts and runs two instances at once while changes revoke and grant (Shards.tla).
\* model Shards
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1"}
    Slots = {1, 2}
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxStarts = 2
    Losses = FALSE
    Duplicates = FALSE
    LostCommits = FALSE
    Restores = 0
    Repeats = FALSE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
    EpochChecked = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
