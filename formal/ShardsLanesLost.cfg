\* A shard starts with its storage lost while Postgres holds what it flushed, Postgres is restored from earlier backups twice, two instances run at once (ShardsLanes.tla).
\* model ShardsLanes
SPECIFICATION Spec
CONSTANTS
    Slots = {1, 2}
    MaxEntries = 3
    MaxStarts = 2
    Rewinds = 2
    StorageLosses = 1
    HeadCAS = TRUE
    CasComparesHash = TRUE
    AdoptOnlyOwnPrefix = TRUE
    RewindChecked = TRUE
    FlushGated = TRUE
INVARIANTS
    LanesHold
    RewindStops
CHECK_DEADLOCK FALSE
