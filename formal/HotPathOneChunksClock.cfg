\* Chunks with a clock that steps back (T169): as HotPathOneChunks, Postgres's clock stepping back once. The checkpoints still seal every use (CheckpointsHold); a use may then sit past its checkpoint's ceiling, which the verifier's bounded read misses and alarms on (CeilingHolds, EXPECTED in scripts/formal.sh, HotPathOne.tla).
\* model HotPathOne
