\* Seal.cfg without the witness: the signer's memory alone, R40 without the audit-watch plugin (Seal.tla).
\* model Seal
SPECIFICATION Spec
CONSTANTS
    Appends = {"a1", "a2", "a3"}
    Changes = {"a3"}
    MaxTicks = 3
    MaxAttacks = 2
    MaxCrashes = 1
    MaxStalls = 0
    NumberUnderLock = TRUE
    CloseLocks = TRUE
    SignerMemory = TRUE
    RowChecked = TRUE
    PairChecked = TRUE
    PairVerified = TRUE
    Witness = FALSE
    RememberFirst = TRUE
    PairRemembered = TRUE
    PairWrittenTogether = TRUE
    MacChecked = TRUE
    KindInMac = TRUE
    RequestIdChecked = TRUE
    WaitForSeal = TRUE
    Fenced = TRUE
    Retention = FALSE
    RetAppend = "r"
    MaxTime = 0
    Fresh = 0
    FreshChecked = TRUE
    DropAfterSeal = TRUE
    FreshBeforeDrop = TRUE
    CutFirst = TRUE
    CutSealed = TRUE
    CutUsesOnly = TRUE
    KeepCutTiles = TRUE
INVARIANTS
    Complete
    SealedDeletionDetected
    SplitViewDetected
    AnsweredChangeKept
    NoForgerySealed
    KindKept
    PairConsistent
    NoUndetectedReplay
    NoFalseAlarm
