\* As Revoking015, each use the vault's one call: nothing asked or kept about the account before it, its generation decided with the rows, and nothing read after it (T145; MCCredentials.tla).
\* model MCCredentials
SPECIFICATION Spec
CONSTANTS
    Procs <- RevokingProcs
    Ops <- RevokingOps
    Budget <- RevokingBudget
    RateCap = 2
    SpentTokenInsertedWithCredential = TRUE
    BindingRecheckUnderHead = TRUE
    MemberRecheckInExchange = TRUE
    RateCountUnderHead = TRUE
    RevokeIssuedCredentials = TRUE
    BindingCheckedAtUse = TRUE
    CredentialFenceUnderHead = TRUE
    CredentialFenceUnlocked = TRUE
    KeptAnswerChecked = TRUE
    Uses015 = TRUE
    CallerFromUse = TRUE
    FencedInUse = TRUE
    UseDecidesGeneration = TRUE
INVARIANTS
    TypeOK
    SingleUse
    NoExchangeAfterUnbind
    ExchangedAtCurrentGeneration
    RateHeld
    NoReleaseAfterEnd
    UnboundStayUnusable
CHECK_DEADLOCK TRUE
