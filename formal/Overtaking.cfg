\* Three heartbeats at once while someone edits an entry past the anchor (MCAudit.tla). The vault's StaysUnsignedOnceFound is Tampering's: here, three checkpoints at once break it (docs/formal.md).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    InitAnchor <- StartAnchor
    Procs <- OvertakingProcs
    Ops <- OvertakingOps
    Budget <- OvertakingBudget
    MaxLen = 12
    Walk = 4
    AppBatch = 2
    AppWalkSteps = FALSE
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    AppLinksWalk = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    CheckpointLinksWalk = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    AnchorHeld = TRUE
    ReadinessChecksHeld = TRUE
    AnchorCas = TRUE
    BeatRetries = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    FoundEditStaysRed
    GreenIsReal
    AnchorNeverBack
CHECK_DEADLOCK TRUE
