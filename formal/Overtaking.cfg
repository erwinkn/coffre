\* Four heartbeats at once, one with its checkpoint, while someone edits an entry behind every cursor (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- OvertakingProcs
    Ops <- OvertakingOps
    Budget <- OvertakingBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    Clears = TRUE
    ClearsOverFault = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundStaysRed
    FoundEditStaysRed
    RewriteNeverGreen
    GreenIsReal
CHECK_DEADLOCK TRUE
