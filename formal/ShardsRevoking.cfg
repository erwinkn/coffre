\* One shard serves a principal while changes revoke and grant it, roll back, and their fences and unfences are lost, duplicated and late; and a writer that does not fence (Shards.tla).
\* model Shards
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1"}
    Slots = {1}
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxStarts = 0
    Losses = TRUE
    Duplicates = TRUE
    LostCommits = TRUE
    Restores = 0
    Repeats = FALSE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
    EpochChecked = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
