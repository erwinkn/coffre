\* Placement A: the app's code, an attacker's, issues in Ada's name while she is demoted or revoked (MCLifecycle.tla).
\* model MCLifecycle
SPECIFICATION Spec
CONSTANTS
    Procs <- CompromisedProcs
    Ops <- CompromisedOps
    Placement = "A"
    Rate = 1
    RevokeTakesFence = TRUE
    IssueOffFence = TRUE
    IssuerLocked = TRUE
    MemberLocked = TRUE
    RateLocked = TRUE
    UseChecksGeneration = TRUE
    SealChecked = TRUE
    HeadInB = TRUE
INVARIANTS
    TypeOK
    RevokeOrdersUses
    AllowedOnSealed
    AllowedAtCurrentGeneration
    SensitiveOnlyFromOwners
    IssuedByLiveCredential
    RateHeld
    UsesNeverWaitOnIssues
    SignInsNeverWaitOnHead
    IssuesHoldNoLockAtApp
    UsesWaitOnlyOnDbWork
CHECK_DEADLOCK TRUE
