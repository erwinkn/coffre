\* A place is archived, then deleted, while members read and write there (MC.tla).
SPECIFICATION Spec
CONSTANTS
    Members <- ReadingMembers
    Rank <- ReadingRank
    Owners <- ReadingOwners
    Roots <- ReadingRoots
    Procs <- ReadingProcs
    Ops <- ReadingOps
    Budget <- ReadingBudget
    InitArchived = {}
    InitGrants <- ReadingGrants
    GrantRereadInDeletion = TRUE
    PlaceReadUnderHead = TRUE
    ArchivedRecheckInDeletion = TRUE
    PatchRecheckUnderHead = TRUE
    KeyPlaceRecheckUnderHead = TRUE
    MemberRecheckInSignin = TRUE
    SortedMemberLocks = TRUE
INVARIANTS
    TypeOK
    NoWaitCycle
    EveryGrantRevocable
    NothingReleasedAfterDeletion
    DeletedStaysUnreachable
    DeletedOnlyWhenArchived
    TombstonesKeepTheirSlug
    TombstonesStayArchived
    AuditBeforeRelease
    CredentialsAtCurrentGeneration
CHECK_DEADLOCK TRUE
