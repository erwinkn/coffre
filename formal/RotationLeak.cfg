\* The deploy to a new key while someone who holds the old one writes the database: entries, pairs, deletions (MCRotation.tla).
\* model MCRotation
SPECIFICATION Spec
CONSTANTS
    MaxN = 4
    MaxCrashes = 1
    Eve = TRUE
    EveBudget = 3
    EveDeletes = "sealed"
    Restore = FALSE
    Rollback = FALSE
    Writers <- TwoWriters
    KeyOf <- TwoKeys
    BoundaryChecked = TRUE
    RetiredRefused = TRUE
    RefusedUnderLock = TRUE
    RotateUnderLock = TRUE
    MemoryUnderPrevious = TRUE
    RowUnderPrevious = TRUE
    RotationProbed = TRUE
    AnchorKeyHeld = TRUE
    PendingAccepted = TRUE
    KeyNeverBack = TRUE
INVARIANTS
    TypeOK
    OneRotation
    OldWritesBelowBoundary
    SealedBelowBoundary
    NoOldPairOverRotation
    VerifiedSound
CHECK_DEADLOCK FALSE
