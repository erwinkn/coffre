\* One shard while changes roll back and the next fences at the same revision, every COMMIT answered (Shards.tla).
\* model Shards
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1"}
    Slots = {1}
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxStarts = 0
    Losses = TRUE
    Duplicates = FALSE
    LostCommits = FALSE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
