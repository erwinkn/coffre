\* A narrows its session for an agent, which uses every path, reads and renews, while Omar revokes or freezes the parent (MCWorkload.tla).
\* model MCWorkload
SPECIFICATION Spec
CONSTANTS
    Procs <- NarrowProcs
    Ops <- NarrowOps
    Budget <- NarrowBudget
    MaxTime = 0
    HardEnd = 2
    Life = 1
    CacheTicks = 0
    Recheck = 1
    KeyCheckedAgainstRow = TRUE
    RequestDigestChecked = TRUE
    OnlySignedHeadersForwarded = TRUE
    NonceEpochs = TRUE
    LiveCheckBeforeCache = TRUE
    TunnelRecheckSeesFreezes = TRUE
    GenerationInStatement = TRUE
    AncestorsChecked = TRUE
    TargetResolvedBeforeConstraints = TRUE
    EncodedSegmentsRefused = TRUE
    ChildOpsRefused = TRUE
    RenewCappedAtNotAfter = TRUE
INVARIANTS
    TypeOK
    NarrowSubset
    RevokeBound
CHECK_DEADLOCK TRUE
