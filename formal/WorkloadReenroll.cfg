\* Beside one replica, which keeps running, a thief enrolls up to three times, leaving in between as it likes (MCWorkloadTripwire.tla).
\* model MCWorkloadTripwire
SPECIFICATION Spec
CONSTANTS
    Procs <- ReenrollProcs
    Ops <- ReenrollOps
    Budget <- ReenrollBudget
    Most <- ReenrollMost
    Replicas = 1
    Life = 2
    Overlap = 1
    Threshold = 2
    MaxTime = 4
    ExcessIntegral = TRUE
    ChurnCounted = TRUE
    RootsOnly = TRUE
    RefusesWhenFull = TRUE
    BusyIsNoSignal = TRUE
    TripLags = FALSE
    TripFencedOnLift = TRUE
    EntryReadFirst = TRUE
    ReplicasFull = FALSE
INVARIANTS
    TypeOK
    TripwireFires
CHECK_DEADLOCK TRUE
