\* Placement A: two CI sign-ins through one binding while svc is removed and admitted again, or a credential revoked (MCLifecycle.tla).
\* model MCLifecycle
SPECIFICATION Spec
CONSTANTS
    Procs <- SignInProcs
    Ops <- SignInOps
    Placement = "A"
    Rate = 1
    RevokeTakesFence = TRUE
    IssueOffFence = TRUE
    IssuerLocked = TRUE
    MemberLocked = TRUE
    RateLocked = TRUE
    UseChecksGeneration = TRUE
    SealChecked = TRUE
    HeadInB = TRUE
INVARIANTS
    TypeOK
    RevokeOrdersUses
    AllowedOnSealed
    AllowedAtCurrentGeneration
    SensitiveOnlyFromOwners
    IssuedByLiveCredential
    RateHeld
    UsesNeverWaitOnIssues
    SignInsNeverWaitOnHead
    IssuesHoldNoLockAtApp
    UsesWaitOnlyOnDbWork
CHECK_DEADLOCK TRUE
