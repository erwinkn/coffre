\* Someone edits an entry behind a beat's cursor and one ahead, and reverts the one ahead while beats walk (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- AheadLog
    Procs <- RevertingProcs
    Ops <- RevertingOps
    Budget <- RevertingBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    Clears = TRUE
    ClearsOverFault = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundEditStaysRed
    RewriteNeverGreen
    GreenIsReal
CHECK_DEADLOCK TRUE
