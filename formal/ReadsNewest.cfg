\* T252: one key read twice by one account, the later read by number from a clock behind the earlier; one projector, which may crash once; one attacker step on `log_read_newest` (delete an entry, or set its time); every protection on (Reads.tla).
\* model MCReads
SPECIFICATION Spec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsNewestScript
    At <- ReadsNewestAt
    Chunk = 2
    Projectors = {"p1"}
    MaxCrashes = 1
    MaxAttacks = 1
    Retention = FALSE
    Attacks = {"newest"}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
    FromChecked = TRUE
    NewestWithRows = TRUE
    GreatestAt = TRUE
    NewestChecked = TRUE
    NewestRetired = TRUE
INVARIANTS
    ProjectionMatchesReplay
    OnlySealedProjected
    LagShown
    NoDuplicate
    DeletionDetected
    SealNeverWaitsOnProjection
    ReportNamesListed
    UnnamedDetected
CHECK_DEADLOCK FALSE
