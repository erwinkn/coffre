\* Ada binds svc's CI through the vault while an admin demotes her; a run signs in through it (PR 3a, MCLifecycle.tla).
\* model MCLifecycle
SPECIFICATION Spec
CONSTANTS
    Procs <- BindProcs
    Ops <- BindOps
    Rate = 1
    RevokeTakesFence = TRUE
    RevokePolicyHeld = TRUE
    IssueOffFence = TRUE
    IssuerLocked = TRUE
    IssuerCAS = TRUE
    IssuePolicyHeld = TRUE
    PolicyIssueFirst = TRUE
    MemberLocked = TRUE
    UseChecksGeneration = TRUE
    BindingLocked = TRUE
    SweepAfterLock = TRUE
    SpentChecked = TRUE
    SealChecked = TRUE
    HashSealed = TRUE
    AppChecksMac = TRUE
    VaultVerifiesToken = TRUE
    BindingSealed = TRUE
INVARIANTS
    TypeOK
    RevokeOrdersUses
    RevokesOnStandingRight
    NothingAfterRevokeAnswered
    AllowedOnSealed
    AllowedAsPresented
    AllowedAtCurrentGeneration
    SensitiveOnlyFromOwners
    IssuedByLiveCredential
    RateHeld
    SpentOnce
    SignInsOnValidTokens
    EndedBindingEndsCredentials
    UsesNeverWaitOnIssues
    UsesTakeNoIssueLock
    IssuesHoldNoLockBetween
    SignInsTakeNoHead
CHECK_DEADLOCK TRUE
