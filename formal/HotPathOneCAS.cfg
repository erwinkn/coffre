\* Two changers racing on one input (the credential), two changes each, while a use reads it: each change reads the row outside the lock, then applies the flip of what it read under the lock exclusive (HotPathOne.tla).
\* model HotPathOne
SPECIFICATION Spec
CONSTANTS
    Inputs = {"credential"}
    Uses = {"u1"}
    Changers = {"c1", "c2"}
    MaxChanges = 2
    MaxAborts = 0
    MaxCheckpoints = 0
    MaxCrashes = 0
    MaxTampers = 0
    SealCache = FALSE
    MaxRestores = 0
    Covers = FALSE
    UseLocks = TRUE
    StatementSnapshot = TRUE
    UseNumberUnderLock = TRUE
    ChangeLocks = TRUE
    ChangeNumberUnderLock = TRUE
    LockToCommit = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    SyncCommit = TRUE
    CheckpointLocks = TRUE
    CoverChecksChanges = TRUE
    CoverChecksAllInputs = TRUE
    SealMember = TRUE
    SealCredential = TRUE
    SealSecret = TRUE
    SealEnvironment = TRUE
    StaleFirst = TRUE
    CacheChecked = TRUE
    CacheSameChange = TRUE
    ChangeCAS = TRUE
    CoverExists = TRUE
INVARIANTS
    TotalOrder
    ReplayAgrees
    NothingAllowedAfterAnswer
    NumbersUnique
    EachChangeFlips
CHECK_DEADLOCK FALSE
