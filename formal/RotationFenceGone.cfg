\* RotationFence one step further: the vault's own rotation, sealed, deleted too (a rotation renumbered is one deleted: `rotationOf` drops it, RotationMove). Its row gone, OneBoundary finds no rotation from the old key, and the fence says nothing: the signer's head, under its own key, is the evidence left (HeadAnchors; Muse's review r3 of #444).
\* model MCRotation
