\* RotationFence one step further: the vault's own rotation, sealed, deleted too (a rotation renumbered is one deleted: `rotationOf` drops it, RotationMove). The newest pair is under the new key, so the old key, no rotation of it counting, vouches for nothing, and the rotation planted into it counts for nothing either (ChainRule; Muse's review r3 of #444).
\* model MCRotation
\* Three numbers are all the trace takes (the rotation, her entry, her rotation into A): 4.8M states, under a minute; with four, 65M and ten (both hold, and both break without ChainRule).
SPECIFICATION Spec
