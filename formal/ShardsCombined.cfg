\* One start (a restart, or a second instance while the first runs), with fences lost, duplicated and sent again, rollbacks and lost COMMIT answers, one client sending use after use; about 5 minutes, run with --long (Shards.tla).
\* model Shards
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1"}
    Slots = {1, 2}
    Uses = {"u1"}
    MaxChanges = 2
    MaxStarts = 1
    Losses = TRUE
    Duplicates = TRUE
    LostCommits = TRUE
    Restores = 0
    Repeats = TRUE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
    EpochChecked = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
