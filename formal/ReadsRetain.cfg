\* Two projectors racing over the same log (Workers retries), one crash, no attacker, and retention dropping what both have passed, the last read timed before every other (Reads.tla).
\* model MCReads
SPECIFICATION Spec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    \* c2's read of k1 timed before the others: listed after any cut, timed below it, as a read of the frozen log.
    At <- ReadsRetainAt
    Chunk = 2
    Projectors = {"p1", "p2"}
    MaxCrashes = 1
    MaxAttacks = 0
    Retention = TRUE
    Attacks = {}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
    FromChecked = TRUE
    NewestWithRows = TRUE
    GreatestAt = TRUE
    NewestChecked = TRUE
    FloorSealed = TRUE
    NewestRetired = TRUE
    RetiredKeptOut = TRUE
    PruneLocked = TRUE
INVARIANTS
    ProjectionMatchesReplay
    OnlySealedProjected
    LagShown
    NoDuplicate
    DeletionDetected
    SealNeverWaitsOnProjection
    RetiredStayGone
    ReportNamesListed
    RetiredUnnamed
CHECK_DEADLOCK FALSE
