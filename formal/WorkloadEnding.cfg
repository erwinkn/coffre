\* A uses, renews and tunnels while Omar freezes any target, revokes, untrusts or removes, and the clock runs to not_after (MCWorkload.tla).
\* model MCWorkload
SPECIFICATION Spec
CONSTANTS
    Procs <- EndingProcs
    Ops <- EndingOps
    Budget <- EndingBudget
    MaxTime = 2
    HardEnd = 2
    Life = 2
    CacheTicks = 1
    Recheck = 1
    KeyCheckedAgainstRow = TRUE
    RequestDigestChecked = TRUE
    OnlySignedHeadersForwarded = TRUE
    NonceEpochs = TRUE
    LiveCheckBeforeCache = TRUE
    TunnelRecheckSeesFreezes = TRUE
    GenerationInStatement = TRUE
    AncestorsChecked = TRUE
    TargetResolvedBeforeConstraints = TRUE
    EncodedSegmentsRefused = TRUE
    ChildOpsRefused = TRUE
    RenewCappedAtNotAfter = TRUE
INVARIANTS
    TypeOK
    FreezeBound
    RevokeBound
    NotAfter
CHECK_DEADLOCK TRUE
