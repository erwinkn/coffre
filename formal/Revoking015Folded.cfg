\* As Revoking015, each use deciding on the credential's generation and its account's, sealed, and the app making no read after it (T145; MCCredentials.tla).
\* model MCCredentials
SPECIFICATION Spec
CONSTANTS
    Procs <- RevokingProcs
    Ops <- RevokingOps
    Budget <- RevokingBudget
    SpentTokenInsertedWithCredential = TRUE
    BindingRecheckUnderChangeLock = TRUE
    MemberRecheckInExchange = TRUE
    RevokeIssuedCredentials = TRUE
    BindingCheckedAtUse = TRUE
    CredentialFenceUnlocked = TRUE
    KeptAnswerChecked = TRUE
    Uses015 = TRUE
    CallerFromUse = FALSE
    FencedInUse = TRUE
    UseDecidesGeneration = TRUE
INVARIANTS
    TypeOK
    SingleUse
    NoExchangeAfterUnbind
    ExchangedAtCurrentGeneration
    NoReleaseAfterEnd
    UnboundStayUnusable
CHECK_DEADLOCK TRUE
