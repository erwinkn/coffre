\* Object locks (L1, T282): two uses, each of one of two keys by one member (the member and its own key's secret), while two changers each revoke or restore the member or either secret, side by side, and the checkpointer closes and signs. A use shares the fence and the locks of the objects it reads; a change shares the fence and takes its object's lock exclusive; the checkpointer alone takes the fence exclusive (HotPathOne.tla).
\* model HotPathOne
