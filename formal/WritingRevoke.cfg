\* Ada writes k twice at once while her grant is taken away and her session revoked (MCWriting.tla).
\* model MCWriting
SPECIFICATION Spec
CONSTANTS
    Procs <- RevokeProcs
    MaxTries = 3
    RequestUnderFence = TRUE
    ReadHeld = TRUE
    Unheld = {}
    DecideOnRead = TRUE
    HoldAfterFence = TRUE
    ReadOnLog = TRUE
    ReadByNumber = TRUE
    WaitForSeal = TRUE
INVARIANTS
    TypeOK
    WritesStandAtCommit
    KeyChangesFlip
    RequestsReplay
    AddsStandAtCommit
    AddsFlip
    CommitsReplay
    AnsweredSealed
    TwoTrips
PROPERTIES
    EveryRequestEnds
CHECK_DEADLOCK TRUE
