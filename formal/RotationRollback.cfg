\* The deploy to a new key, then its config rolled back: the signer started again under the old key (MCRotation.tla).
\* model MCRotation
SPECIFICATION Spec
CONSTANTS
    MaxN = 4
    MaxCrashes = 1
    Eve = FALSE
    EveBudget = 0
    EveDeletes = "none"
    Restore = FALSE
    Rollback = TRUE
    Chunked = FALSE
    EveMoves = FALSE
    EveClaims = FALSE
    Reader = FALSE
    Writers <- TwoWriters
    KeyOf <- TwoKeys
    BoundaryChecked = TRUE
    RetiredRefused = TRUE
    RefusedUnderLock = TRUE
    RotateUnderLock = TRUE
    MemoryUnderPrevious = TRUE
    RowUnderPrevious = TRUE
    RotationProbed = TRUE
    AnchorKeyHeld = TRUE
    PendingAccepted = TRUE
    KeyNeverBack = TRUE
    NumberInRotation = TRUE
    SignerVerified = TRUE
    KeyringBound = TRUE
    SnapshotRead = TRUE
INVARIANTS
    TypeOK
    OneRotation
    SealedBelowBoundary
    NoOldPairOverRotation
CHECK_DEADLOCK FALSE
