\* Two instances enroll on one code of one replica, renew, restart and log out, a third enrolls, while the clock runs and CI promotes the next code (MCWorkloadEnrollment.tla).
\* model MCWorkloadEnrollment
SPECIFICATION Spec
CONSTANTS
    Procs <- CapacityProcs
    Ops <- CapacityOps
    Budget <- CapacityBudget
    Replicas = 1
    Life = 2
    MaxTime = 2
    Initial = {"c1", "c2"}
    CountUnderHead = TRUE
    RenewOnlyLive = TRUE
    SupersedeCheckedAtExchange = TRUE
    SupersedeCheckedAtRenewal = TRUE
    SupersedeCheckInUpdate = TRUE
    ScopeFromCode = TRUE
    SensitiveNeedsOwnerMinter = TRUE
    MinterFence = TRUE
    MintRefusesEnrollment = TRUE
    MintedByNotSelf = TRUE
    MintRefusesChildren = TRUE
INVARIANTS
    TypeOK
    Capacity
    Superseded
CHECK_DEADLOCK TRUE
