\* A request appends, two heartbeats walk and checkpoint at once, and someone edits or rewrites the chain (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- TamperingProcs
    Ops <- TamperingOps
    Budget <- TamperingBudget
    MaxLen = 9
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 9
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    Clears = TRUE
    ClearsOverFault = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundStaysRed
    FoundEditStaysRed
    RewriteNeverGreen
    EditFoundByNextScrub
    GreenIsReal
CHECK_DEADLOCK TRUE
