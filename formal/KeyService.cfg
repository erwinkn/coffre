\* Two uses, a read and a rewrap at the key service in one isolate, which answers late or never (MCKeyService.tla).
\* model MCKeyService
SPECIFICATION Spec
CONSTANTS
    Procs <- KeyProcs
    Uses <- KeyUses
    Keys <- KeyKeys
    Slots = 2
    SlotsPerCall = TRUE
INVARIANTS
    TypeOK
    WaitsOnlyBehindItsOwn
    UsesNeverWait
CHECK_DEADLOCK TRUE
