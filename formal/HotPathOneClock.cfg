\* Clocks: two uses, each stamped by the Worker's clock with a deadline, while Postgres's clock moves on and steps back once, and the checkpointer's barriers raise the floor of `at` and two checkpoints read their windows from it (HotPathOneClock.tla).
\* model HotPathOneClock
