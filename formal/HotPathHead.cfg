\* Two uses, each retried once, while a change revokes then grants again. Uses lock the head row for their append statement alone; changes take it too and raise the revision in it (HotPath.tla).
\* model HotPath
SPECIFICATION Spec
CONSTANTS
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxAborts = 1
    MaxCheckpoints = 0
    Mode = "head"
    FenceChecked = TRUE
    FenceUnderLock = TRUE
    ChangeLocks = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    CheckpointLocks = TRUE
    FloorChecked = TRUE
INVARIANTS
    FenceHolds
    NothingAllowedAfterAnswer
    EveryReleaseAudited
    LogConsistent
    CheckpointsHold
    NumbersUnique
CHECK_DEADLOCK FALSE
