\* Two reads through a reference and one of a key, among a repoint and a credential moved; one projector, which may crash once; two attacker steps on any table (delete or swap uses, delete a change, edit a live row, delete, copy or make up a projection row, set the cursor); every protection on (Reads.tla).
\* model MCReads
SPECIFICATION Spec
CONSTANTS
    Creds = {"c1", "c2"}
    Keys = {"k1", "k2"}
    Ref = "r"
    Accounts = {"A", "B"}
    Places = {"p", "q"}
    Start <- ReadsStart
    Script <- ReadsScript
    Chunk = 2
    Projectors = {"p1"}
    MaxCrashes = 1
    MaxAttacks = 2
    Attacks = {"uses", "changes", "live", "reads", "cursor"}
    DeriveFromSealed = TRUE
    InputsInUseMac = TRUE
    ProjectSealedOnly = TRUE
    WindowChecked = TRUE
    NumberInMac = TRUE
    IdempotentByNumber = TRUE
    CursorAfterRows = TRUE
    CursorMac = TRUE
    ReplaceOnConflict = TRUE
    CountChecked = TRUE
    ProjectorApart = TRUE
INVARIANTS
    ProjectionMatchesReplay
    OnlySealedProjected
    LagShown
    NoDuplicate
    DeletionDetected
    SealNeverWaitsOnProjection
CHECK_DEADLOCK FALSE
