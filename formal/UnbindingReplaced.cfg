\* A replacement, its request stopping once, then for good, after any step: the new binding is made as the old one closes, and the scheduled run ends the old (reviews r8, r9; MCUnbinding.tla).
\* model MCUnbinding
SPECIFICATION Spec
CONSTANTS
    SignIns <- OneRun
    Creds <- TwoCreds
    Batch = 1
    Crashes = 1
    Using = FALSE
    Replacing = TRUE
    Abandons = TRUE
    Closes = TRUE
    SignInChecksClosed = TRUE
    CloseExclusive = TRUE
    EndComplete = TRUE
    EndExclusive = TRUE
    SealWait = TRUE
    Resumes = TRUE
    RevokeCAS = TRUE
    EndChecksLive = TRUE
    UseChecksClosed = TRUE
    MakesAtClose = TRUE
    CloseFenced = TRUE
    BatchFenced = TRUE
    VaultChecksClosed = FALSE
INVARIANTS
    TypeOK
    EndedBindingEndsCredentials
    ClosedServesNone
    RevokeOrdersUses
    NoGapInTrust
    NoSignInAfterClose
    NoDoubleRevoke
    EndsOnce
    AnsweredWhenSealed
PROPERTIES
    ClosedStaysClosed
    RemovalEnds
CHECK_DEADLOCK FALSE
