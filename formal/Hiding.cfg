\* Someone edits an entry, then hides the beat that found it while another commits, and puts it back (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- HidingProcs
    Ops <- HidingOps
    Budget <- HidingBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundEditStaysRed
    RewriteNeverGreen
    GreenIsReal
CHECK_DEADLOCK TRUE
