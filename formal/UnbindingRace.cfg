\* Two runs signing in at once while the binding closes, the person's request and the scheduled run removing it at once: none signs in once closed, no credential revoked twice, the binding ended once (MCUnbinding.tla).
\* model MCUnbinding
SPECIFICATION Spec
CONSTANTS
    SignIns <- TwoRuns
    Creds <- TwoCreds
    Batch = 1
    Crashes = 1
    Using = TRUE
    Replacing = FALSE
    Abandons = TRUE
    Closes = TRUE
    SignInChecksClosed = TRUE
    CloseExclusive = TRUE
    EndComplete = TRUE
    EndExclusive = TRUE
    SealWait = TRUE
    Resumes = TRUE
    RevokeCAS = TRUE
    EndChecksLive = TRUE
    UseChecksClosed = TRUE
    MakesAtClose = TRUE
    CloseFenced = TRUE
    BatchFenced = TRUE
    VaultChecksClosed = FALSE
INVARIANTS
    TypeOK
    EndedBindingEndsCredentials
    ClosedServesNone
    RevokeOrdersUses
    NoGapInTrust
    NoSignInAfterClose
    NoDoubleRevoke
    EndsOnce
    AnsweredWhenSealed
PROPERTIES
    ClosedStaysClosed
CHECK_DEADLOCK FALSE
