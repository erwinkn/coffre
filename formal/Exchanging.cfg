\* Two runs present one ID token at once, and another each, while an owner untrusts, replaces keys, or removes the account (MCCredentials.tla).
\* model MCCredentials
SPECIFICATION Spec
CONSTANTS
    Procs <- ExchangingProcs
    Ops <- ExchangingOps
    Budget <- ExchangingBudget
    RateCap = 2
    SpentTokenInsertedWithCredential = TRUE
    BindingRecheckUnderHead = TRUE
    MemberRecheckInExchange = TRUE
    RateCountUnderHead = TRUE
    RevokeIssuedCredentials = TRUE
    BindingCheckedAtUse = TRUE
    CredentialFenceUnderHead = TRUE
    CredentialFenceUnlocked = TRUE
    KeptAnswerChecked = TRUE
    Uses015 = FALSE
    CallerFromUse = FALSE
    FencedInUse = FALSE
    UseDecidesGeneration = FALSE
INVARIANTS
    TypeOK
    SingleUse
    NoExchangeAfterUnbind
    ExchangedAtCurrentGeneration
    RateHeld
    NoReleaseAfterEnd
    NoReadOnStaleAnswer
    UnboundStayUnusable
CHECK_DEADLOCK TRUE
