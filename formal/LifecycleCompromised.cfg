\* The app's own code, an attacker's: an issue in Ada's name, a binding of its own, a token nobody signed (MCLifecycle.tla).
\* model MCLifecycle
SPECIFICATION Spec
CONSTANTS
    Procs <- CompromisedProcs
    Ops <- CompromisedOps
    Rate = 1
    RevokeTakesFence = TRUE
    IssueOffFence = TRUE
    IssuerLocked = TRUE
    IssuerCAS = TRUE
    MemberLocked = TRUE
    UseChecksGeneration = TRUE
    BindingLocked = TRUE
    SweepAfterLock = TRUE
    SpentChecked = TRUE
    SealChecked = TRUE
    HashSealed = TRUE
    AppChecksMac = TRUE
    VaultVerifiesToken = TRUE
    BindingSealed = TRUE
INVARIANTS
    TypeOK
    RevokeOrdersUses
    NothingAfterRevokeAnswered
    AllowedOnSealed
    AllowedAsPresented
    AllowedAtCurrentGeneration
    SensitiveOnlyFromOwners
    IssuedByLiveCredential
    RateHeld
    SpentOnce
    SignInsOnValidTokens
    EndedBindingEndsCredentials
    UsesNeverWaitOnIssues
    IssuesHoldNoLockBetween
    SignInsTakeNoHead
CHECK_DEADLOCK TRUE
