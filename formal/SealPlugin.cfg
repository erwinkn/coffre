\* Seal.cfg without the signer's memory: the witness alone, a stateless signer that restarts from the database's newest row (Seal.tla). It does not keep SealedDeletionDetected or SplitViewDetected: scripts/formal-seal.sh shows both broken (a crash between writing a head and publishing it).
\* model Seal
SPECIFICATION Spec
CONSTANTS
    Appends = {"a1", "a2", "a3"}
    Changes = {"a3"}
    MaxTicks = 3
    MaxAttacks = 2
    MaxCrashes = 1
    NumberUnderLock = TRUE
    CloseLocks = TRUE
    SignerMemory = FALSE
    RowChecked = TRUE
    Witness = TRUE
    RememberFirst = TRUE
    MacChecked = TRUE
    RequestIdChecked = TRUE
    WaitForSeal = TRUE
INVARIANTS
    Complete
    AnsweredChangeKept
    NoForgerySealed
    NoUndetectedReplay
    NoFalseAlarm
CHECK_DEADLOCK FALSE
