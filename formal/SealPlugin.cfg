\* Seal.cfg without the signer's memory: the witness alone, a stateless signer that restarts from each tree's newest row (Seal.tla). It does not keep SealedDeletionDetected or SplitViewDetected: scripts/formal.sh shows both broken (a crash between writing a pair and publishing it).
\* model Seal
SPECIFICATION Spec
CONSTANTS
    Appends = {"a1", "a2", "a3"}
    Changes = {"a3"}
    MaxTicks = 3
    MaxAttacks = 2
    MaxCrashes = 1
    NumberUnderLock = TRUE
    CloseLocks = TRUE
    SignerMemory = FALSE
    RowChecked = TRUE
    PairChecked = TRUE
    PairVerified = TRUE
    Witness = TRUE
    RememberFirst = TRUE
    PairRemembered = TRUE
    PairWrittenTogether = TRUE
    MacChecked = TRUE
    KindInMac = TRUE
    RequestIdChecked = TRUE
    WaitForSeal = TRUE
INVARIANTS
    Complete
    AnsweredChangeKept
    NoForgerySealed
    KindKept
    PairConsistent
    NoUndetectedReplay
    NoFalseAlarm
CHECK_DEADLOCK FALSE
