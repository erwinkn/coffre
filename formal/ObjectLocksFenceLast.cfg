\* Object locks with a change's fence after its objects' locks (L1, T282): ObjectLocks' flow, the change and the revoke taking each object's lock and then the fence. It must hold: no wait cycle needs the fence first while every change takes the issue lock before both, which orders it against the barrier (WriteLocks.tla).
\* model WriteLocks
SPECIFICATION Spec
CONSTANTS
    Flow = "objects"
    TouchFirst = TRUE
    WriteTakesChangeLock = TRUE
    MembersFirst = TRUE
    ChangeLockFirst = TRUE
    IssueBeforeFence = TRUE
    BarrierIssueFirst = TRUE
    UsesInKeyOrder = TRUE
    ChangesInKeyOrder = TRUE
    PrincipalLast = TRUE
    FenceFirst = FALSE
INVARIANTS
    TypeOK
    NoWaitCycle
CHECK_DEADLOCK TRUE
