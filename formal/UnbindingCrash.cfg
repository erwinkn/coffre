\* The same, the person's request stopping midway, twice, and asked again: the binding stays closed, and the rerun ends it (MCUnbinding.tla).
\* model MCUnbinding
SPECIFICATION Spec
CONSTANTS
    SignIns <- OneRun
    Creds <- TwoCreds
    Batch = 1
    Crashes = 2
    Using = FALSE
    Replacing = FALSE
    Abandons = FALSE
    Closes = TRUE
    SignInChecksClosed = TRUE
    CloseExclusive = TRUE
    EndComplete = TRUE
    EndExclusive = TRUE
    SealWait = TRUE
    Resumes = TRUE
    RevokeCAS = TRUE
    EndChecksLive = TRUE
    UseChecksClosed = TRUE
    MakesAtClose = TRUE
    CloseFenced = TRUE
    BatchFenced = TRUE
    VaultChecksClosed = FALSE
INVARIANTS
    TypeOK
    EndedBindingEndsCredentials
    ClosedServesNone
    RevokeOrdersUses
    NoGapInTrust
    NoSignInAfterClose
    NoDoubleRevoke
    EndsOnce
    AnsweredWhenSealed
PROPERTIES
    ClosedStaysClosed
    UnbindFinishes
    RemovalEnds
CHECK_DEADLOCK FALSE
