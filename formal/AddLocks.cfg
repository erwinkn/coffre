\* A member add's locks: the members' rows and the change lock, then its hold's issue lock and fence, against a demotion of the adder, an issue to them, the checkpointer's barrier, a revoke and a use, with Postgres's lock queue (WriteLocks.tla).
\* model WriteLocks
