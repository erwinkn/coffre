\* Two uses, each retried once, while a change revokes then grants again. Uses share an advisory lock for their append; changes and the checkpointer take it exclusively; the checkpointer closes numbers below a floor, then signs (HotPath.tla).
\* model HotPath
SPECIFICATION Spec
CONSTANTS
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxAborts = 1
    MaxCheckpoints = 2
    Mode = "seq"
    FenceChecked = TRUE
    FenceUnderLock = TRUE
    ChangeLocks = TRUE
    CommitBeforeAnswer = TRUE
    ReleaseAfterCommit = TRUE
    CheckpointLocks = TRUE
    FloorChecked = TRUE
INVARIANTS
    FenceHolds
    NothingAllowedAfterAnswer
    EveryReleaseAudited
    LogConsistent
    CheckpointsHold
    NumbersUnique
CHECK_DEADLOCK FALSE
