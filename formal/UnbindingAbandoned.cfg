\* The person's request stopping midway for good: the scheduled run resumes the closed binding's removal and ends it (MCUnbinding.tla).
\* model MCUnbinding
SPECIFICATION Spec
CONSTANTS
    SignIns <- OneRun
    Creds <- TwoCreds
    Batch = 1
    Crashes = 1
    Using = FALSE
    Replacing = FALSE
    Abandons = TRUE
    Closes = TRUE
    SignInChecksClosed = TRUE
    CloseExclusive = TRUE
    EndComplete = TRUE
    EndExclusive = TRUE
    SealWait = TRUE
    Resumes = TRUE
    RevokeCAS = TRUE
    EndChecksLive = TRUE
    UseChecksClosed = TRUE
    MakesAtClose = TRUE
    CloseFenced = TRUE
    BatchFenced = TRUE
    VaultChecksClosed = FALSE
INVARIANTS
    TypeOK
    EndedBindingEndsCredentials
    ClosedServesNone
    RevokeOrdersUses
    NoGapInTrust
    NoSignInAfterClose
    NoDoubleRevoke
    EndsOnce
    AnsweredWhenSealed
PROPERTIES
    ClosedStaysClosed
    RemovalEnds
CHECK_DEADLOCK FALSE
