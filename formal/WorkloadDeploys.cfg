\* One replica crashes and restarts, redeploys twice on its code and narrows twice, and nobody else holds the code (MCWorkloadTripwire.tla).
\* model MCWorkloadTripwire
SPECIFICATION Spec
CONSTANTS
    Procs <- DeploysProcs
    Ops <- DeploysOps
    Budget <- DeploysBudget
    Most <- DeploysMost
    Replicas = 1
    Life = 2
    Overlap = 1
    Threshold = 4
    MaxTime = 5
    ExcessIntegral = TRUE
    ChurnCounted = TRUE
    RootsOnly = TRUE
    RefusesWhenFull = TRUE
    BusyIsNoSignal = TRUE
    ReplicasFull = TRUE
    ThiefStays = TRUE
INVARIANTS
    TypeOK
    WithinOwnBudget
    NoFalseContention
CHECK_DEADLOCK TRUE
