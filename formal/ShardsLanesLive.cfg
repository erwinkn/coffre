\* As ShardsLanes, without the rewind, the instance the storage takes flushing eventually: every entry reaches Postgres (ShardsLanes.tla).
\* model ShardsLanes
SPECIFICATION LiveSpec
CONSTANTS
    Slots = {1, 2}
    MaxEntries = 3
    MaxStarts = 2
    Rewinds = 0
    HeadCAS = TRUE
    RewindChecked = TRUE
    FlushGated = TRUE
INVARIANTS
    LanesHold
    RewindStops
CHECK_DEADLOCK FALSE
PROPERTIES
    EveryEntryFlushed
