\* A sign-in issues a new credential (T123, R58) while two uses run, each naming an old credential or, once its sign-in answered, the new one, a change revokes or restores the member, and the checkpointer closes and signs twice; a use may ride its isolate's cover or pass its seal cache, and a call may fail before its commit. The issue takes the issue lock shared, never the fence; the barrier waits for it on that lock, then takes the fence (HotPathOne.tla).
\* model HotPathOne
