\* Two CI sign-ins through one binding, one ID token replayed or two, while svc is removed (and admitted again) or a credential revoked (MCLifecycle.tla).
\* model MCLifecycle
SPECIFICATION Spec
CONSTANTS
    Procs <- SignInProcs
    Ops <- SignInOps
    Rate = 1
    RevokeTakesFence = TRUE
    RevokePolicyHeld = TRUE
    IssueOffFence = TRUE
    IssuerLocked = TRUE
    IssuerCAS = TRUE
    IssuePolicyHeld = TRUE
    PolicyIssueFirst = TRUE
    MemberLocked = TRUE
    UseChecksGeneration = TRUE
    BindingLocked = TRUE
    SweepAfterLock = TRUE
    SpentChecked = TRUE
    SealChecked = TRUE
    HashSealed = TRUE
    AppChecksMac = TRUE
    VaultVerifiesToken = TRUE
    BindingSealed = TRUE
INVARIANTS
    TypeOK
    RevokeOrdersUses
    RevokesOnStandingRight
    NothingAfterRevokeAnswered
    AllowedOnSealed
    AllowedAsPresented
    AllowedAtCurrentGeneration
    SensitiveOnlyFromOwners
    IssuedByLiveCredential
    RateHeld
    SpentOnce
    SignInsOnValidTokens
    EndedBindingEndsCredentials
    UsesNeverWaitOnIssues
    UsesTakeNoIssueLock
    IssuesHoldNoLockBetween
    SignInsTakeNoHead
CHECK_DEADLOCK TRUE
