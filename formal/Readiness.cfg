\* Requests append while two heartbeats, whose walks cover less than the log, run at once, and a monitor asks (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    InitAnchor <- StartAnchor
    Procs <- ReadinessProcs
    Ops <- ReadinessOps
    Budget <- ReadinessBudget
    MaxLen = 12
    Walk = 2
    CkptWalk = 2
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    AnchorHeld = TRUE
    ReadinessChecksHeld = TRUE
    AnchorCas = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundEditStaysRed
    GreenIsReal
    AnchorNeverBack
CHECK_DEADLOCK TRUE
