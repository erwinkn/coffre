\* Requests append while two heartbeats walk part of the log and checkpoint behind the head, and a monitor asks for readiness (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- ReadinessProcs
    Ops <- ReadinessOps
    Budget <- ReadinessBudget
    MaxLen = 9
    Walk = 2
    CkptWalk = 2
    ScrubWalk = 9
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    Clears = TRUE
    ClearsOverFault = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundStaysRed
    RewriteNeverGreen
    EditFoundByNextScrub
    GreenIsReal
CHECK_DEADLOCK TRUE
