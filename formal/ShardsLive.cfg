\* As ShardsRevoking, every step but arrivals, rollbacks and losses taken eventually: changes end and every use is answered (Shards.tla).
\* model Shards
SPECIFICATION LiveSpec
CONSTANTS
    Shards = {"s1"}
    Slots = {1}
    Uses = {"u1", "u2"}
    MaxChanges = 2
    MaxStarts = 0
    Losses = TRUE
    Duplicates = FALSE
    LostCommits = TRUE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
PROPERTIES
    ChangesEnd
    UsesAnswered
