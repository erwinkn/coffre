\* A beat walks past an entry before it is edited; the finder's row is edited while the next beat reads where to resume, then put back (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    Procs <- MaskingProcs
    Ops <- MaskingOps
    Budget <- MaskingBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    ReadinessInOneSnapshot = TRUE
    OneSnapshot = TRUE
    CursorByMac = TRUE
    NoResumePastFinding = TRUE
    ReadinessWalks = TRUE
    ReadinessAsksVault = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundEditStaysRed
    RewriteNeverGreen
    GreenIsReal
CHECK_DEADLOCK TRUE
