\* An Owner, a Viewer or CI mints a code while the Owner is demoted, a thief in the app or a child mints or promotes, and an instance enrolls (MCWorkloadEnrollment.tla).
\* model MCWorkloadEnrollment
SPECIFICATION Spec
CONSTANTS
    Procs <- MintingProcs
    Ops <- MintingOps
    Budget <- MintingBudget
    Replicas = 1
    Life = 2
    MaxTime = 0
    Initial = {"c1"}
    CountUnderHead = TRUE
    RenewOnlyLive = TRUE
    SupersedeCheckedAtExchange = TRUE
    SupersedeCheckedAtRenewal = TRUE
    SupersedeCheckInUpdate = TRUE
    ScopeFromCode = TRUE
    SensitiveNeedsOwnerMinter = TRUE
    MinterFence = TRUE
    MintRefusesEnrollment = TRUE
    MintedByNotSelf = TRUE
    MintRefusesChildren = TRUE
INVARIANTS
    TypeOK
    MinterBound
CHECK_DEADLOCK TRUE
