\* The gap after a sign-in's MAC check (T192): HotPathOneForged, but the writer tampers twice: it puts a revoked row back, lets the vault check the newest change's MAC, then writes the row's seal into that change. The one changer is a sign-in (PinnedChangers): the model's issues (Issuers) make a credential's object of their own and hold no row, so the row a sign-in holds to its newest change is a change's here, as for every write that does (ChangeChecksMac). Its statement holds the newest change to the one checked (ChangePinsChecked), or it goes ahead on the writer's row; without the pin, this is a write that pins nothing (`app_change`, `issue_token` outside T179's two trips). With AppPins the app hands the change over, any authentic one of the object under any number: three changes, so that an older one differs from the newest, and the pin must be whole (ChangePinsWhole), not number and seal (review r2). One use, so that it stays cheap.
\* model HotPathOne
