\* Object locks (L1, T282): a use of two objects, a use of one, a batch whose round 2 enters a key in its principal's set, a change of both objects in one statement and a revoke of one, which takes the issue lock shared as every change does, against the checkpointer's barrier, with Postgres's lock queue: the fence shared, then each object's lock in key order, then the principal's (WriteLocks.tla).
\* model WriteLocks
SPECIFICATION Spec
CONSTANTS
    Flow = "objects"
    TouchFirst = TRUE
    WriteTakesChangeLock = TRUE
    MembersFirst = TRUE
    ChangeLockFirst = TRUE
    IssueBeforeFence = TRUE
    BarrierIssueFirst = TRUE
    UsesInKeyOrder = TRUE
    ChangesInKeyOrder = TRUE
    PrincipalLast = TRUE
    FenceFirst = TRUE
INVARIANTS
    TypeOK
    NoWaitCycle
CHECK_DEADLOCK TRUE
