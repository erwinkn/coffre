\* Seals, covers and the cap together: two uses of one principal, each asking for one of two keys (at most one in any window of 2), reading the credential, while a change revokes or restores it once and a database writer puts back one row: a use refused `stale` still moves the cap's row as the replay does, and a repeat after a change is logged again and counted (HotPathOne.tla).
\* model HotPathOne
