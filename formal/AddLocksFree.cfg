\* The same add without the change lock: no cycle closes either, so the lock it keeps is for what changes read, not for its own waits (WriteLocks.tla).
\* model WriteLocks
SPECIFICATION Spec
CONSTANTS
    Flow = "add"
    TouchFirst = TRUE
    WriteTakesChangeLock = TRUE
    MembersFirst = TRUE
    AddTakesChangeLock = FALSE
    ChangeLockFirst = TRUE
    IssueBeforeFence = TRUE
    BarrierIssueFirst = TRUE
INVARIANTS
    TypeOK
    NoWaitCycle
CHECK_DEADLOCK TRUE
