\* A sends two requests and B one while eve replays, tampers, forges and swaps, and A's gate restarts or rotates (MCWorkload.tla).
\* model MCWorkload
SPECIFICATION Spec
CONSTANTS
    Procs <- ReplayProcs
    Ops <- ReplayOps
    Budget <- ReplayBudget
    MaxTime = 0
    HardEnd = 2
    Life = 1
    CacheTicks = 0
    Recheck = 1
    KeyCheckedAgainstRow = TRUE
    RequestDigestChecked = TRUE
    OnlySignedHeadersForwarded = TRUE
    NonceEpochs = TRUE
    LiveCheckBeforeCache = TRUE
    TunnelRecheckSeesFreezes = TRUE
    GenerationInStatement = TRUE
    AncestorsChecked = TRUE
    TargetResolvedBeforeConstraints = TRUE
    ChildOpsRefused = TRUE
    RenewCappedAtNotAfter = TRUE
INVARIANTS
    TypeOK
    CopyIsUseless
    ForwardedIsSigned
    ProofOnce
CHECK_DEADLOCK TRUE
