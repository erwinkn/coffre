\* A fork regenerates the key it inherits while the parent renames or writes it (MC.tla).
SPECIFICATION Spec
CONSTANTS
    Members <- RegeneratingMembers
    Rank <- RegeneratingRank
    InitOwners <- RegeneratingOwners
    Listed = {}
    Admins = {}
    Procs <- RegeneratingProcs
    Ops <- RegeneratingOps
    Budget <- RegeneratingBudget
    InitArchived = {}
    InitGrants <- RegeneratingGrants
    InitRef <- NoRef
    IntentsLogged = FALSE
    GrantRereadInDeletion = TRUE
    PlaceReadUnderChangeLock = TRUE
    ArchivedRecheckInDeletion = TRUE
    PatchRecheckUnderChangeLock = TRUE
    KeyPlaceRecheckUnderChangeLock = TRUE
    EnvCreateRecheckUnderChangeLock = TRUE
    SecretPatchRecheckUnderChangeLock = TRUE
    MemberRecheckInSignin = TRUE
    SortedMemberLocks = TRUE
    StandingRecheckUnderChangeLock = TRUE
    RotationClosesIntents = TRUE
    EndRecheckUnderChangeLock = TRUE
    SourceRecheckInReference = TRUE
    ArchiveRefusedWhileRead = TRUE
    ReferenceRereadInDeletion = TRUE
    LastOwnerCheckUnderChangeLock = TRUE
    InheritedRecheckUnderChangeLock = TRUE
INVARIANTS
    TypeOK
    NoWaitCycle
    EveryGrantRevocable
    NothingReleasedAfterDeletion
    DeletedStaysUnreachable
    DeletedOnlyWhenArchived
    TombstonesKeepTheirSlug
    TombstonesStayArchived
    AuditBeforeRelease
    CredentialsAtCurrentGeneration
    NothingReleasedAfterRevocation
    IntentsAccounted
    NothingReleasedThroughEndedReference
    EveryReferenceBreakable
    ReferencedSourcesStayLive
    OwnerStays
    DeclaredStay
    RegeneratesReplaceWhatTheyListed
CHECK_DEADLOCK TRUE
