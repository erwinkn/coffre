    Rank <- RegeneratingRank
    InitOwners <- RegeneratingOwners
    Listed = {}
    Admins = {}
    Procs <- RegeneratingProcs
    Ops <- RegeneratingOps
    Budget <- RegeneratingBudget
    InitArchived = {}
    InitGrants <- RegeneratingGrants
    InitRef <- NoRef
    GrantRereadInDeletion = TRUE
    PlaceReadUnderHead = TRUE
    ArchivedRecheckInDeletion = TRUE
    PatchRecheckUnderHead = TRUE
