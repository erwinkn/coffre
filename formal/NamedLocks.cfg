\* A named use's read before its locks (L1, T282): Ada asks twice for a key by name while her standing at the place is revoked and granted, and, in one of two runs, someone makes the key, writes it under its lock, deletes it and makes it again. The read names the key only to a caller who stands; the locks are one take; the statement decides again.
\* model NamedLocks
SPECIFICATION Spec
CONSTANTS
    Budget = 2
    MaxKeys = 2
    StandingBeforeKey = TRUE
INVARIANTS
    TypeOK
    NoKeyLockBeforeStanding
    NoWaitBeforeStanding
    NoIsFixed
CHECK_DEADLOCK FALSE
