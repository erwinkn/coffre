\* As ShardsCredentials, the first credential revoked and the one issued later kept, every step taken eventually: the new credential is usable at either shard (ShardsCredentials.tla).
\* model ShardsCredentials
SPECIFICATION LiveSpec
CONSTANTS
    Shards = {"s1", "s2"}
    Creds = {"c1", "c2"}
    Revocable = {"c1"}
    Uses = {"u1", "u2"}
    MaxChanges = 1
    CredentialRevokeFenced = TRUE
    UnknownCredentialRereads = TRUE
INVARIANTS
    NoUseAfterCredentialRevoked
CHECK_DEADLOCK FALSE
PROPERTIES
    IssuedUsable
