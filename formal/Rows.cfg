\* Someone edits and puts back any entry, heartbeat rows among them, while two beats run and a monitor asks (MCAudit.tla).
\* model MCAudit
SPECIFICATION Spec
CONSTANTS
    InitLog <- StartLog
    InitAnchor <- StartAnchor
    Procs <- RowsProcs
    Ops <- RowsOps
    Budget <- RowsBudget
    MaxLen = 10
    Walk = 4
    CkptWalk = 4
    ScrubWalk = 1
    WalkChecksFrom = TRUE
    WalkChecksAppMacs = TRUE
    CheckpointChecksVault = TRUE
    SeenRecheckUnderHead = TRUE
    Scrubs = TRUE
    AnchorHeld = TRUE
    ReadinessChecksHeld = TRUE
    AnchorCas = TRUE
    BeatRetries = TRUE
INVARIANTS
    TypeOK
    SignsNoForgedVault
    StaysUnsignedOnceFound
    FoundEditStaysRed
    GreenIsReal
    AnchorNeverBack
CHECK_DEADLOCK TRUE
