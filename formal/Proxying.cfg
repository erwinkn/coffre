\* A reader uses its token through the credential proxy alone, its use logged by the vault or the app, while an owner revokes it or removes the account (MCCredentials.tla).
\* model MCCredentials
SPECIFICATION Spec
CONSTANTS
    Procs <- ProxyingProcs
    Ops <- ProxyingOps
    Budget <- ProxyingBudget
    RateCap = 2
    SpentTokenInsertedWithCredential = TRUE
    BindingRecheckUnderHead = TRUE
    MemberRecheckInExchange = TRUE
    RateCountUnderHead = TRUE
    RevokeIssuedCredentials = TRUE
    BindingCheckedAtUse = TRUE
    CredentialFenceUnderHead = TRUE
    CredentialFenceUnlocked = TRUE
    KeptAnswerChecked = TRUE
    Uses015 = FALSE
    CallerFromUse = FALSE
    FencedInUse = FALSE
    UseDecidesGeneration = FALSE
INVARIANTS
    TypeOK
    SingleUse
    NoExchangeAfterUnbind
    ExchangedAtCurrentGeneration
    RateHeld
    NoReleaseAfterEnd
    NoReadOnStaleAnswer
    UnboundStayUnusable
CHECK_DEADLOCK TRUE
