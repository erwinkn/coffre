\* Two shards serve one principal (its fan-out) while a change revokes it, or rolls back (Shards.tla).
\* model Shards
SPECIFICATION Spec
CONSTANTS
    Shards = {"s1", "s2"}
    Slots = {1}
    Uses = {"u1", "u2"}
    MaxChanges = 1
    MaxStarts = 0
    Losses = FALSE
    Duplicates = FALSE
    LostCommits = FALSE
    Restores = 0
    Repeats = FALSE
    FencePersisted = TRUE
    FenceBeforeCommit = TRUE
    AllAcked = TRUE
    FloorChecked = TRUE
    NowaitProbe = TRUE
    ProbeKeepsFence = TRUE
    UnfenceProbes = TRUE
    OneSnapshot = TRUE
    DurableBeforeReply = TRUE
    StorageArbiter = TRUE
    FencedWritesOnly = TRUE
    EpochChecked = TRUE
INVARIANTS
    NothingReleasedAfterRevocation
    UsesOrderedAgainstChanges
    EveryReplyAudited
    FloorsAtMostNext
CHECK_DEADLOCK FALSE
