# Deploys both Workers on every push to main: the database is migrated
# first, then the vault, then the app (pnpm run deploy). A migration that
# fails stops the run before anything deploys, and the Workers keep running
# the previous version, which runs on the new schema too.
#
# Its three secrets are the repository's Actions secrets, which coffre setup
# sets: CLOUDFLARE_API_TOKEN (Workers Scripts, Account Settings, Workers KV,
# Hyperdrive and the zone's Workers Routes), CLOUDFLARE_ACCOUNT_ID, and
# DATABASE_OWNER_URL, the database owner's direct URL, which only the migrate
# step sees. docs/deploy.md in coffre's repository has the rest.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a push during a deploy waits for it to end.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install, exactly as pnpm-lock.yaml says
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Migrate
        # The URL goes to coffre on stdin, never as an argument.
        run: printenv DATABASE_OWNER_URL | pnpm exec coffre migrate --yes
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      - name: Deploy the vault, then the app
        run: pnpm run deploy
