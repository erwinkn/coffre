# zizmor (scripts/zizmor.sh, `pnpm check:workflows`): every action pinned to a
# full commit SHA, its version in a comment beside it, `owner/repo@<sha> #
# vX.Y.Z`; the same repository's own actions through `$/`, at the running
# commit. The other audits run at their defaults.
rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
