name: Coffre checks
on:
  push:
    branches: [feat/cloudflare-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: coffre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coffre
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: coffre
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffre"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_DATABASE: coffre
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psynthetic-test-password"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql://coffre:synthetic-test-password@127.0.0.1:5432/coffre
      TEST_MYSQL_URL: mysql://root:synthetic-test-password@127.0.0.1:3306/coffre
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run cli:build && node dist/coffre.mjs help
      - name: Verify PostgreSQL runtime audit privileges
        run: node scripts/check-postgres-role.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffre-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=coffre-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-source
          path: coffre-source.zip
          retention-days: 7
