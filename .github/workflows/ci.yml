name: Coffre checks
on:
  push:
    branches: [feat/cloudflare-rebuild]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: coffre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Bootstrap lockfile on the rebuild branch only
        if: hashFiles('package-lock.json') == ''
        env:
          BRANCH: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$BRANCH" = 'refs/heads/feat/cloudflare-rebuild'
          test "$EVENT" = 'push'
          npm install --package-lock-only --ignore-scripts
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path('apps/web/src/styles.css')
          p.write_text(p.read_text().replace('max-width:min(440px,calc(100vw - 32px)))}', 'max-width:min(440px,calc(100vw - 32px))}'))
          p = Path('apps/web/src/components/console.tsx')
          p.write_text(p.read_text().replace('${Math.min(effectivePage * 8, filtered.length)}`', '${Math.min(effectivePage * 8, filtered.length)} of ${filtered.length}`'))
          PYFIX
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json apps/web/src/styles.css apps/web/src/components/console.tsx
          git commit -m 'build: lock rebuilt dependencies and normalize transferred UI source'
          git push origin HEAD:feat/cloudflare-rebuild
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coffre
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: coffre
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffre"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_DATABASE: coffre
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psynthetic-test-password"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql://coffre:synthetic-test-password@127.0.0.1:5432/coffre
      TEST_MYSQL_URL: mysql://root:synthetic-test-password@127.0.0.1:3306/coffre
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run cli:build && node dist/coffre.mjs help
      - name: Verify PostgreSQL runtime audit privileges
        run: node scripts/check-postgres-role.mjs
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffre-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
