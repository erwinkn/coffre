name: Deploy Coffre Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coffre-production
  cancel-in-progress: false

jobs:
  release-ref:
    name: Require protected release branch
    runs-on: ubuntu-24.04
    steps:
      - name: Accept only main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = 'refs/heads/main'

  validate:
    name: Validate release
    needs: release-ref
    uses: ./.github/workflows/validate.yml

  migrate:
    name: Migrate private database
    needs: validate
    runs-on: coffre-migrations
    environment: coffre-migrations
    timeout-minutes: 30

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run owner migration and verify runtime restrictions
        env:
          COFFRE_DATABASE_CA_CERTIFICATE: ${{ secrets.COFFRE_DATABASE_CA_CERTIFICATE }}
          COFFRE_DATABASE_IP: ${{ vars.COFFRE_DATABASE_IP }}
          COFFRE_DATABASE_PORT: ${{ vars.COFFRE_DATABASE_PORT }}
          COFFRE_OWNER_DATABASE_URL: ${{ secrets.COFFRE_OWNER_DATABASE_URL }}
          COFFRE_RUNTIME_PASSWORD: ${{ secrets.COFFRE_RUNTIME_PASSWORD }}
          COFFRE_RUNTIME_ROLE: ${{ vars.COFFRE_RUNTIME_ROLE }}
        run: ./scripts/migrate-private-database.sh

  deploy:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-24.04
    environment: coffre-production
    timeout-minutes: 10

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker, bindings, secrets, route, and Cron trigger
        env:
          COFFRE_INSTANCE: deploy/equisafe.jsonc
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          COFFRE_ACCESS_ISSUER: ${{ secrets.COFFRE_ACCESS_ISSUER }}
          COFFRE_ACCESS_JWKS_URL: ${{ secrets.COFFRE_ACCESS_JWKS_URL }}
          COFFRE_ACCESS_AUD: ${{ secrets.COFFRE_ACCESS_AUD }}
          COFFRE_ROOT_ADMINS: ${{ secrets.COFFRE_ROOT_ADMINS }}
          COFFRE_KEK_LOCAL: ${{ secrets.COFFRE_KEK_LOCAL }}
          COFFRE_KEK_ID: ${{ secrets.COFFRE_KEK_ID }}
          COFFRE_KEK_LOCAL_PREVIOUS: ${{ secrets.COFFRE_KEK_LOCAL_PREVIOUS }}
          COFFRE_AUDIT_CHAIN_KEY: ${{ secrets.COFFRE_AUDIT_CHAIN_KEY }}
        run: pnpm --dir apps/web deploy
