name: Deploy Coffre Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coffre-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application and database contracts
        run: |
          pnpm test
          pnpm test:schema
          pnpm check:pins
          pnpm check:contrast
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web smoke:production

  migrate:
    name: Migrate from the private network
    needs: validate
    runs-on: ubuntu-24.04
    environment: coffre-production
    timeout-minutes: 30

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          version: v2.58.3
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Run owner migration and verify runtime restrictions
        env:
          SCW_DEFAULT_ZONE: ${{ vars.SCW_DEFAULT_ZONE }}
          COFFRE_DATABASE_CA_CERTIFICATE: ${{ secrets.COFFRE_DATABASE_CA_CERTIFICATE }}
          COFFRE_OWNER_DATABASE_URL: ${{ secrets.COFFRE_OWNER_DATABASE_URL }}
          COFFRE_RUNTIME_PASSWORD: ${{ secrets.COFFRE_RUNTIME_PASSWORD }}
          COFFRE_RUNTIME_ROLE: ${{ vars.COFFRE_RUNTIME_ROLE }}
        run: ./scripts/migrate-on-scaleway.sh

  deploy:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-24.04
    environment: coffre-production
    timeout-minutes: 10

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker, bindings, secrets, route, and Cron trigger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          COFFRE_ACCESS_ISSUER: ${{ secrets.COFFRE_ACCESS_ISSUER }}
          COFFRE_ACCESS_JWKS_URL: ${{ secrets.COFFRE_ACCESS_JWKS_URL }}
          COFFRE_ACCESS_AUD: ${{ secrets.COFFRE_ACCESS_AUD }}
          COFFRE_ROOT_ADMINS: ${{ secrets.COFFRE_ROOT_ADMINS }}
          COFFRE_KEK_LOCAL: ${{ secrets.COFFRE_KEK_LOCAL }}
          COFFRE_KEK_ID: ${{ secrets.COFFRE_KEK_ID }}
          COFFRE_KEK_LOCAL_PREVIOUS: ${{ secrets.COFFRE_KEK_LOCAL_PREVIOUS }}
          COFFRE_AUDIT_CHAIN_KEY: ${{ secrets.COFFRE_AUDIT_CHAIN_KEY }}
        run: pnpm --dir apps/web deploy
