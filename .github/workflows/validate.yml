name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Classify release changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.diff.outputs.version_only }}
    steps:
      - name: Check out the selected revision and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Hold the detector and gate to their contracts
        run: node --test scripts/version-only.test.mjs scripts/validate-gate.test.mjs
      - name: Prove a version-only diff or select all checks
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/version-only.mjs "$BASE_SHA" HEAD

  checks:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:pins
          pnpm check:contrast
          pnpm check:docs

  tests:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # Tests use coffre:source and generate their own Worker fixtures.
          build: 'false'
      - name: Tests
        run: pnpm test

  schema:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Database schema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
      - name: Database schema
        run: pnpm test:schema

  # The Formal model is three jobs. The plan hashes everything TLC's answer
  # depends on (scripts/formal-key.sh) and looks for a green run of that
  # hash; three shards run TLC when there is none; `Formal model` is the one
  # job Validate asks about. docs/formal.md, "In CI".
  formal-plan:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Formal model plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      key: ${{ steps.plan.outputs.key }}
      hit: ${{ steps.plan.outputs.hit }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hash the model's inputs and look for a green run of them
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          scripts/formal-key.sh | tee "$RUNNER_TEMP/manifest.txt"
          key="$(tail -n 1 "$RUNNER_TEMP/manifest.txt")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # A green run saves "<key>-<run id>" (the last step of `Formal model`). The cache API
          # lists every ref's caches, where a restore sees only this PR's and main's: a model
          # merged from a PR is a hit for the next one.
          hit=false
          run=""
          # A lookup that fails is a full run, the safe way.
          labels="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')" || labels=full-formal
          if grep -qx full-formal <<< "$labels"; then
            echo "The full-formal label asks for a full run."
          else
            # Newest first. A key counts only if the run in it is one of this workflow's, its
            # commit holds the very files the key hashes (so a doctored workflow's run, which
            # saved a key of its choosing, is no source) and, in some attempt, its `Formal
            # model` job ran the step named for this very key and run (the last step below,
            # which runs only after every shard held). Jobs of every attempt.
            candidates="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$key-" -f per_page=100 -f sort=created_at -f direction=desc |
              jq -r --arg prefix "$key-" '.actions_caches[] | select(.key | startswith($prefix)) | "\(.key | ltrimstr($prefix)) \(.ref) \(.created_at)"')" || candidates=""
            while read -r id cref created; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              { read -r path; read -r sha; } < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.path, .head_sha') || continue
              [ "$path" = .github/workflows/validate.yml ] || continue
              git fetch -q --depth=1 origin "$sha" || continue
              git diff --quiet HEAD "$sha" -- 'formal/*.tla' 'formal/*.cfg' scripts/formal.sh scripts/formal-trace.mjs scripts/formal-key.sh .github/workflows/validate.yml || continue
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all" --jq '.jobs[] | select(.name == "Formal model") | .steps[] | select(.conclusion == "success") | .name' | grep -qxF "Save it as $key-$id" || continue
              hit=true
              run="$id"
              ref="$cref"
              break
            done <<< "$candidates"
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$hit" = true ]; then
            msg="TLC skipped: $key was model-checked green in run $run ($ref, $created): https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
          else
            msg="TLC runs: no green run of $key"
          fi
          echo "::notice title=Formal model::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  formal-shard:
    needs: formal-plan
    if: ${{ needs.formal-plan.outputs.hit == 'false' }}
    name: Formal shard ${{ matrix.shard }}
    strategy:
      # Every shard's counterexamples in one run, rather than the first failing's.
      fail-fast: false
      matrix:
        # scripts/formal.sh shard_of; the longest, Tampering, is 7 to 11 minutes. 4g, not the script's 1g: Tampering
        # took 11 on a 4-core, 16 GB runner at 1g and 7 at 4g or 8g, and 11 to 12 at 12g, or at 8g with 2 or 8 workers.
        shard: [tampering, large, rest]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hold this runner's Java to the plan's
        env:
          KEY: ${{ needs.formal-plan.outputs.key }}
        run: |
          mine="$(scripts/formal-key.sh | tail -n 1)"
          [ "$mine" = "$KEY" ] || { echo "::error::This runner's key is $mine, the plan's $KEY: another Java, or another checkout. Re-run all jobs, not only the failed ones."; exit 1; }
      - name: Model-check the shard
        # TLC, pinned by its checksum in the script, on the runner's Java (docs/formal.md).
        run: scripts/formal.sh --workers 4 --heap 4g --shard ${{ matrix.shard }}

  formal:
    needs: [changes, formal-plan, formal-shard]
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Formal model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard, or a green run of the same inputs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .["formal-plan"].result == "success" and
            (if .["formal-plan"].outputs.hit == "true"
              then .["formal-shard"].result == "skipped"
              else .["formal-shard"].result == "success" end)
          ' <<< "$RESULTS"
      - name: Record the green run
        # Only after every shard held, and not when the plan found a green run already.
        if: ${{ needs.formal-plan.outputs.hit != 'true' }}
        run: echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/formal-green"
      - name: Save it as ${{ needs.formal-plan.outputs.key }}-${{ github.run_id }}
        if: ${{ needs.formal-plan.outputs.hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/formal-green
          key: ${{ needs.formal-plan.outputs.key }}-${{ github.run_id }}

  proofs:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Formal proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # The differential test runs core's and the vault's sources.
          build: 'false'
      - name: Check the Lean proofs and hold their model to the code
        # Lean, pinned by its checksum in the script (docs/formal.md).
        run: pnpm formal:lean

  workers:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Workers conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Workers conformance
        # The runner's Chrome, named: the pages check runs, rather than skips.
        run: |
          pnpm conformance:workers --browser /usr/bin/google-chrome

  node:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Node conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Node conformance
        run: |
          pnpm conformance:node --browser /usr/bin/google-chrome

  consumer:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Packed consumer (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [workers, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # The consumer script builds before packing; keep that single build.
          build: 'false'
      # The packed client declares Node 20 and up: the consumer test loads and
      # calls it on each Node named here (scripts/client-smoke.cjs). 24, the
      # workspace's, goes last so that it is the Node the rest runs on.
      - name: Install Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Name Node.js 20
        run: echo "COFFRE_CLIENT_NODES=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      - name: Name Node.js 22
        run: echo "COFFRE_CLIENT_NODES=$COFFRE_CLIENT_NODES $(command -v node)" >> "$GITHUB_ENV"
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Name Node.js 24
        run: echo "COFFRE_CLIENT_NODES=$COFFRE_CLIENT_NODES $(command -v node)" >> "$GITHUB_ENV"
      - name: Packed consumer
        run: pnpm test:consumer --kind ${{ matrix.kind }}

  compat:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Previous release on this schema (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [workers, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # The schema comes from this checkout's sources; the release from npm.
          build: 'false'
      - name: The newest release, migrated with this revision's migrations
        run: pnpm test:compat --kind ${{ matrix.kind }}

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    needs: [changes, checks, tests, schema, formal, proofs, workers, node, consumer, compat]
    if: always()
    steps:
      - name: Require full validation or a proven version-only bump
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            ((.changes.outputs.version_only == "true") as $fast
              | del(.changes)
              | all(.[]; .result == (if $fast then "skipped" else "success" end)))
          ' <<< "$RESULTS"
