name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:pins
          pnpm check:contrast
          pnpm check:docs

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # Tests use coffre:source and generate their own Worker fixtures.
          build: 'false'
      - name: Tests
        run: pnpm test

  schema:
    name: Database schema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
      - name: Database schema
        run: pnpm test:schema

  workers:
    name: Workers conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Workers conformance
        run: |
          pnpm conformance:workers

  node:
    name: Node conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Node conformance
        run: |
          pnpm conformance:node

  consumer:
    name: Packed consumer (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [workers, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # The consumer script builds before packing; keep that single build.
          build: 'false'
      - name: Packed consumer
        run: pnpm test:consumer --kind ${{ matrix.kind }}

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    needs: [checks, tests, schema, workers, node, consumer]
    if: always()
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
