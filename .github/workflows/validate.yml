name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Classify release changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.diff.outputs.version_only }}
    steps:
      - name: Check out the selected revision and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Hold the detector and gate to their contracts
        run: node --test scripts/version-only.test.mjs scripts/validate-gate.test.mjs
      - name: Prove a version-only diff or select all checks
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/version-only.mjs "$BASE_SHA" HEAD

  checks:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:pins
          pnpm check:contrast
          pnpm check:docs

  tests:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # Tests use coffre:source and generate their own Worker fixtures.
          build: 'false'
      - name: Tests
        run: pnpm test

  schema:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Database schema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
      - name: Database schema
        run: pnpm test:schema

  formal:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Formal model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Model-check the locking protocol
        # TLC, pinned by its checksum in the script, on the runner's Java (docs/formal.md).
        run: scripts/formal.sh --workers 4

  workers:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Workers conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Workers conformance
        # The runner's Chrome, named: the pages check runs, rather than skips.
        run: |
          pnpm conformance:workers --browser /usr/bin/google-chrome

  node:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Node conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
      - name: Node conformance
        run: |
          pnpm conformance:node --browser /usr/bin/google-chrome

  consumer:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.version_only != 'true') }}
    name: Packed consumer (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [workers, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/prepare
        with:
          # The consumer script builds before packing; keep that single build.
          build: 'false'
      - name: Packed consumer
        run: pnpm test:consumer --kind ${{ matrix.kind }}

  # compat, the previous release on this revision's schema (pnpm test:compat),
  # is off for 0.4.0, a clean break with no earlier release on its schema,
  # and returns for 0.5.0, holding 0.4.0 (AGENTS.md, "Migrations").

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    needs: [changes, checks, tests, schema, formal, workers, node, consumer]
    if: always()
    steps:
      - name: Require full validation or a proven version-only bump
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.result == "success" and
            ((.changes.outputs.version_only == "true") as $fast
              | del(.changes)
              | all(.[]; .result == (if $fast then "skipped" else "success" end)))
          ' <<< "$RESULTS"
