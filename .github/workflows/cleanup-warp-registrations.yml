name: Clean up Coffre WARP registrations

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report stale registrations without deleting them
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-coffre-warp-registrations
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale CI device registrations
    runs-on: ubuntu-24.04
    environment: coffre-maintenance
    timeout-minutes: 5

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Remove registrations older than six hours
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WARP_DEVICE_PROFILE_ID: ${{ vars.CLOUDFLARE_WARP_DEVICE_PROFILE_ID }}
          CLOUDFLARE_WARP_ORGANIZATION: ${{ vars.CLOUDFLARE_WARP_ORGANIZATION }}
          CLOUDFLARE_ZERO_TRUST_API_TOKEN: ${{ secrets.CLOUDFLARE_ZERO_TRUST_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          node scripts/cleanup-warp-registrations.mjs "${args[@]}"
