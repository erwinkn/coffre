name: Cloudflare rebuild checks
on:
  push:
    branches: [feat/cloudflare-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Check execution environment
        run: |
          node --version
          npm --version
          if test -f scripts/check-rebuild.mjs; then node scripts/check-rebuild.mjs; else echo 'Rebuild bootstrap ready'; fi
