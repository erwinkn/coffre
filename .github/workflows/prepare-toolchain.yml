name: Prepare rebuild toolchain
on:
  push:
    branches: [feat/cloudflare-rebuild]
    paths: [.github/workflows/prepare-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Resolve exact, mature package versions
        run: |
          mkdir -p /tmp/coffre-toolchain
          cd /tmp/coffre-toolchain
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const groups={dependencies:['@tanstack/react-start','@tanstack/react-router','react','react-dom','@base-ui/react','class-variance-authority','clsx','tailwind-merge','lucide-react','jose','drizzle-orm','pg','mysql2','aws4fetch'],devDependencies:['@cloudflare/vite-plugin','@cloudflare/workers-types','@vitejs/plugin-react','@tailwindcss/vite','tailwindcss','vite','wrangler','miniflare','typescript','@types/node','@types/pg','@types/react','@types/react-dom','@playwright/test','prettier']};
          const cutoff=Date.now()-7*86400000;
          const manifest={name:'coffre',version:'0.1.0',private:true,type:'module',engines:{node:'>=22.16.0'}};
          for(const [group,names]of Object.entries(groups)){
            manifest[group]={};
            for(const name of names){
              const res=await fetch('https://registry.npmjs.org/'+encodeURIComponent(name));if(!res.ok)throw Error(name+': '+res.status);
              const metadata=await res.json();const major=name==='typescript'?5:name==='@types/node'?22:['react','react-dom','@types/react','@types/react-dom'].includes(name)?19:null;
              const versions=Object.keys(metadata.versions).filter(v=>/^\d+\.\d+\.\d+$/.test(v)&&Date.parse(metadata.time[v])<cutoff&&(!major||v.startsWith(major+'.'))).sort((a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++)if(x[i]!==y[i])return y[i]-x[i];return 0;});
              if(!versions.length)throw Error('No mature version: '+name);manifest[group][name]=versions[0];console.log(name+' '+versions[0]);
            }
          }
          await writeFile('package.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          npm install --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          tar -czf /tmp/coffre-toolchain.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: coffre-toolchain
          path: /tmp/coffre-toolchain.tar.gz
          retention-days: 1
          compression-level: 0
