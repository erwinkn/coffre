name: Prepare validation
description: Install frozen dependencies and optionally build the packages on the workspace's Node
inputs:
  build:
    description: Build packages before running the checks
    default: 'true'
runs:
  using: composite
  steps:
    - name: Reserve Postgres's port before network downloads
      shell: bash
      run: ./scripts/reserve-postgres-port.sh
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install frozen dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # Typecheck needs the generated route tree and declarations; conformance
    # runs the built packages. Each lane builds its own revision.
    - name: Build the packages
      if: inputs.build == 'true'
      shell: bash
      run: pnpm build
