name: coffre
description: Read an environment from coffre, mask its secrets, and make them available to subsequent steps
inputs:
  url:
    description: URL of your coffre instance
    required: true
  token:
    description: A coffre service token with read access to the environment; or, instead, `service`
    required: false
  environment:
    description: The project/environment to read
    required: true
  service:
    description: >-
      Instead of a token: the coffre service this run signs in as, with the ID token GitHub signs for it,
      through a trust binding that accepts this workflow's runs. The job needs `permissions: id-token: write`.
    required: false
runs:
  using: composite
  steps:
    - name: Read and mask secrets
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if ! command -v node >/dev/null || ! command -v npx >/dev/null; then
          echo '::error::coffre requires Node.js 20 or newer and npx. Set up your job toolchain before this Action.' >&2
          exit 1
        fi
        if ! node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 20 ? 0 : 1)'; then
          echo '::error::coffre requires Node.js 20 or newer. Set up your job toolchain before this Action.' >&2
          exit 1
        fi
        if { [ -n "$INPUT_TOKEN" ] && [ -n "$INPUT_SERVICE" ]; } || { [ -z "$INPUT_TOKEN" ] && [ -z "$INPUT_SERVICE" ]; }; then
          echo '::error::coffre needs one of token or service: service signs this run in with its ID token, without a stored secret.' >&2
          exit 1
        fi
        if [ -n "$INPUT_SERVICE" ] && [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo '::error::service needs the job to have `permissions: id-token: write`.' >&2
          exit 1
        fi
        # The token goes on stdin, never in an argument, which ps shows; a
        # service needs nothing more than its name and the runner's ID token.
        if [ -n "$INPUT_SERVICE" ]; then
          set -- --service "$INPUT_SERVICE"
        else
          set -- --token-file -
        fi
        printf '%s' "$INPUT_TOKEN" | npx -y @coffre/cli@0.2.0 --url "$INPUT_URL" "$@" export --format github "$INPUT_ENVIRONMENT"
