name: coffre
description: Read an environment from coffre, mask its secrets, and make them available to subsequent steps
inputs:
  url:
    description: URL of your coffre instance
    required: true
  token:
    description: A coffre service token with read access to the environment
    required: true
  environment:
    description: The project/environment to read
    required: true
  oidc:
    description: 'Coming: authenticate with GitHub OIDC instead of a service token. This input has no effect yet.'
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    - name: Read and mask secrets
      shell: bash
      env:
        COFFRE_API_URL: ${{ inputs.url }}
        COFFRE_TOKEN: ${{ inputs.token }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: npx -y @coffre/cli@0.1.14 export --format github "$INPUT_ENVIRONMENT"
