services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: coffre_owner
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: coffre
      # Deterministic collation so ordering does not drift between machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffre_owner -d coffre']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - coffre-pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/migrations:ro

volumes:
  coffre-pgdata:
