services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: coffre_owner
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: coffre
      # Deterministic collation so ordering does not drift between machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coffre_owner -d coffre']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - coffre-pgdata-v16:/var/lib/postgresql/data
      - ./packages/db/migrations:/migrations:ro

volumes:
  # Versioned so adopting the PostgreSQL 16 production baseline never mounts
  # (or destroys) an incompatible PostgreSQL 17 development volume.
  coffre-pgdata-v16:
